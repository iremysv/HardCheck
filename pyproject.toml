[project]
name = "hardcheck"
version = "0.1.0"
description = "Lightweight, read-only Linux hardening auditor"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.dependencies]
PyYAML = "^6.0"
Jinja2 = "^3.1"
rich = "^13.0"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov",
  "ruff>=0.11"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
