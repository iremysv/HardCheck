[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hardcheck"
version = "0.1.0"
description = "Lightweight, read-only Linux hardening auditor"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["PyYAML>=6.0", "Jinja2>=3.1", "rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.11"]

[project.scripts]
hardcheck = "hardcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hardcheck = ["i18n/*.yaml", "rules/*.yaml", "reports/templates/*.j2", "reports/templates/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
