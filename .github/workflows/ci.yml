name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade installer
        run: python -m pip install --upgrade "pip>=26.2,<27"
      - name: Install development and security dependencies
        run: python -m pip install -e ".[dev,security]"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Tests
        run: python -m pytest --cov=hardcheck --cov-report=term-missing
      - name: Panel contract tests
        run: HARDCHECK_TEST_PYTHON=python node --test web/tests/report.test.cjs
      - name: Validate installed wheel and source distribution
        shell: bash
        run: |
          python -m build --no-isolation
          for artifact in dist/*.whl dist/*.tar.gz; do
            target="$RUNNER_TEMP/hardcheck-${artifact##*/}"
            python -m venv "$target"
            "$target/bin/python" -m pip install --upgrade 'pip>=26.2,<27'
            "$target/bin/python" -m pip install "$artifact"
            (cd "$RUNNER_TEMP"; "$target/bin/python" -I "$GITHUB_WORKSPACE/scripts/validate_install.py")
            (cd "$RUNNER_TEMP"; "$target/bin/python" -I "$GITHUB_WORKSPACE/scripts/validate_local_install.py")
          done

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Upgrade installer
        run: python -m pip install --upgrade "pip>=26.2,<27"
      - name: Install development and security dependencies
        run: python -m pip install -e ".[dev,security]"
      - name: Static security analysis
        run: python -m bandit -c pyproject.toml -r src scripts
      - name: Offline tracked-file secret scan
        run: python scripts/check_secrets.py
      - name: Audit installed dependency versions
        run: python scripts/audit_dependencies.py
